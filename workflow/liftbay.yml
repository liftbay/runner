# Liftbay builds on your own GitHub Actions minutes.
# Liftbay starts this workflow; it does nothing on your own pushes or pull requests. With this file on the
# default branch, Liftbay uses workflow_dispatch. Otherwise (a branch you're trying out), Liftbay points a
# temporary liftbay/build/<platform>/<build id> branch at your commit, which runs this file from that commit,
# and deletes it once the build has started.
# The build gets no repository secrets: the runner exchanges this run's GitHub OIDC token for a
# one-time Liftbay job token, checked against this repository and this workflow file.
# Docs: https://github.com/liftbay/runner
name: Liftbay build
run-name: Liftbay build ${{ inputs.build_id || github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: Liftbay build id
        required: true
        type: string
      platform:
        description: Platform
        required: true
        type: choice
        options: [android, ios]
      api_url:
        description: Liftbay API
        required: false
        type: string
        default: https://api.liftbay.dev
  push:
    branches: ["liftbay/build/**"]

permissions:
  contents: read
  id-token: write

env:
  # Pinned runner release. The archive's SHA-256 is checked before the runner starts.
  # Release notes and provenance: https://github.com/liftbay/runner/releases/tag/v0.1.3
  RUNNER_VERSION: "0.1.3"
  RUNNER_SHA256_LINUX_AMD64: "5c1f9b625664b7faa17c41d761a4186ee1e2918506fb0a43e3da98a2c2c12c71"
  RUNNER_SHA256_DARWIN_ARM64: "4aaffe9c0b059b446198a0054e042fc37fd3e3025609c10c16790f6c01a1a846"

jobs:
  android:
    if: inputs.platform == 'android' || startsWith(github.ref_name, 'liftbay/build/android/')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # GitHub's Linux runners start with about 14 GB free; a React Native release build (NDKs, CMake, four
      # architectures, Gradle caches) can use more. Remove preinstalled toolchains no app build uses.
      - name: Free disk space
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift /usr/local/lib/node_modules /usr/local/share/powershell /usr/local/share/chromium /opt/microsoft /opt/google/chrome || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h / | tail -1

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache JavaScript dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.npm
            ~/.cache/yarn
            ~/.local/share/pnpm/store
            ~/.bun/install/cache
          key: js-${{ runner.os }}-${{ hashFiles('package-lock.json', 'yarn.lock', 'pnpm-lock.yaml', 'bun.lock', 'bun.lockb') }}
          restore-keys: js-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json', 'yarn.lock', 'pnpm-lock.yaml', 'bun.lock', 'bun.lockb', 'android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install the Liftbay runner
        env:
          # Bring your own runner: set the repository variables LIFTBAY_RUNNER_URL (a
          # liftbay-runner tar.gz you built) and LIFTBAY_RUNNER_SHA256.
          RUNNER_URL: ${{ vars.LIFTBAY_RUNNER_URL }}
          RUNNER_SHA256: ${{ vars.LIFTBAY_RUNNER_SHA256 || env.RUNNER_SHA256_LINUX_AMD64 }}
        run: |
          set -euo pipefail
          url="${RUNNER_URL:-https://github.com/liftbay/runner/releases/download/v${RUNNER_VERSION}/liftbay-runner_${RUNNER_VERSION}_linux_amd64.tar.gz}"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/liftbay-runner.tar.gz" "$url"
          echo "${RUNNER_SHA256}  $RUNNER_TEMP/liftbay-runner.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/liftbay-runner.tar.gz" -C "$RUNNER_TEMP" liftbay-runner
          "$RUNNER_TEMP/liftbay-runner" version

      - name: Build
        env:
          LIFTBAY_BUILD_ID: ${{ inputs.build_id }}
          LIFTBAY_API_URL: ${{ inputs.api_url || vars.LIFTBAY_API_URL || 'https://api.liftbay.dev' }}
        # On a liftbay/build/<platform>/<build id> branch, the build id is the branch name's last part.
        run: 'LIFTBAY_BUILD_ID="${LIFTBAY_BUILD_ID:-${GITHUB_REF_NAME##*/}}" "$RUNNER_TEMP/liftbay-runner" run'

  ios:
    if: inputs.platform == 'ios' || startsWith(github.ref_name, 'liftbay/build/ios/')
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache JavaScript dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.npm
            ~/Library/Caches/Yarn
            ~/Library/pnpm/store
            ~/.bun/install/cache
          key: js-${{ runner.os }}-${{ hashFiles('package-lock.json', 'yarn.lock', 'pnpm-lock.yaml', 'bun.lock', 'bun.lockb') }}
          restore-keys: js-${{ runner.os }}-

      # Only the download caches: a restored ios/Pods would make expo prebuild see a half project.
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
          key: pods-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock', 'package-lock.json', 'yarn.lock', 'pnpm-lock.yaml', 'bun.lock', 'bun.lockb') }}
          restore-keys: pods-${{ runner.os }}-

      - name: Install the Liftbay runner
        env:
          RUNNER_URL: ${{ vars.LIFTBAY_RUNNER_URL_MACOS }}
          RUNNER_SHA256: ${{ vars.LIFTBAY_RUNNER_SHA256_MACOS || env.RUNNER_SHA256_DARWIN_ARM64 }}
        run: |
          set -euo pipefail
          url="${RUNNER_URL:-https://github.com/liftbay/runner/releases/download/v${RUNNER_VERSION}/liftbay-runner_${RUNNER_VERSION}_darwin_arm64.tar.gz}"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/liftbay-runner.tar.gz" "$url"
          echo "${RUNNER_SHA256}  $RUNNER_TEMP/liftbay-runner.tar.gz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/liftbay-runner.tar.gz" -C "$RUNNER_TEMP" liftbay-runner
          "$RUNNER_TEMP/liftbay-runner" version

      - name: Build
        env:
          LIFTBAY_BUILD_ID: ${{ inputs.build_id }}
          LIFTBAY_API_URL: ${{ inputs.api_url || vars.LIFTBAY_API_URL || 'https://api.liftbay.dev' }}
        # On a liftbay/build/<platform>/<build id> branch, the build id is the branch name's last part.
        run: 'LIFTBAY_BUILD_ID="${LIFTBAY_BUILD_ID:-${GITHUB_REF_NAME##*/}}" "$RUNNER_TEMP/liftbay-runner" run'
